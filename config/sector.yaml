# ------------------------------------------------------------------ Time & Counting Rules
time_window:
  year_min: 2004          # Aligned with Query_Calibration_Taxonomy_Audit.ipynb (YEAR_WINDOW)
  year_max: 2025
  truncation_years: 3     # Last 3 priority/filing years incomplete due to 18-month publication + PATSTAT lag
  family_time_column: "earliest_filing_year"
  appln_time_column: "appln_filing_year"
  publn_truncation_years: 1

counting_rules:
  ipr_type: "PI"          # Patents of Invention only (excludes utility models)
  ip5_offices: ["EP", "US", "CN", "JP", "KR"]
  top_n_categories: 8
  top_n_applicants: 15
  incumbent_split_year: 2018  # Applicants with first UAV family before this year are incumbents

# ------------------------------------------------------------------ Step 0 Query Configuration
# Preferred workflow: consume Samuele's locked Step 0 family CSV so every team notebook shares
# the exact same DOCDB family universe. If the CSV is not present, the loader builds the query
# directly from the structured rules below.
step0:
  locked_families_csv_candidates:
    - "data/raw/00_family_roster.csv"
    - "../data/raw/00_family_roster.csv"
    - "data/uav_core_boundary_validation/uav_final_query_families.csv"
    - "../data/uav_core_boundary_validation/uav_final_query_families.csv"
    - "data/processed/step0_uav_families.csv"
    - "../data/processed/step0_uav_families.csv"

  # Unconditional aerial-exclusive core classes (high precision)
  # NOTE on IPC B64C 39/02 & CPC G05D 1/228:
  #   - IPC B64C 39/02 is "Aircraft characterised by special use" (includes manned special-purpose aircraft,
  #     which dropped unconditional Core precision to 51.4% in the Nov 18 audit). It must be gated by
  #     UAV keywords in the Boundary Rescue tier rather than kept unconditional.
  #   - CPC G05D 1/228 covers on-board command input for ALL unmanned vehicles (including UGVs/USVs)
  #     and should likewise be gated by aerial UAV keywords.
  core_cpc_prefixes:
    - "B64U"          # Unmanned aerial vehicles [UAVs]; equipment therefor (dedicated CPC subclass since 2023)
    - "B64C39/024"    # CPC-specific RPV / remote-controlled aircraft (pre-2023 UAV home)
    - "B64C2201"      # Former UAV indexing scheme (reclassified into B64U in 2023; retained as safety net)
    - "G08G5/57"      # Air traffic control / guidance specifically for unmanned aircraft
    - "G08G5/27"      # Air traffic control network coverage management for UAVs

  core_ipc_prefixes:
    - "B64U"          # IPC B64U (introduced 2023; recovers CN/JP/KR families lacking CPC reclassification)

  # Boundary classes rescued ONLY when English title or abstract matches positive_keywords
  # and does NOT match negative_keywords
  boundary_cpc_prefixes:
    - "G05D1/"        # Control of position, course, altitude or attitude of vehicles (incl. G05D 1/228)
    - "G08G5/"        # Traffic control systems for aircraft (high-purity UAV subgroups like G08G 5/59, 5/55)

  boundary_ipc_prefixes:
    - "B64C39/02"     # IPC special-use aircraft (contains historical CN/JP/KR UAVs; requires keyword gate)

  # Positive & negative regex keywords calibrated in Query_Calibration_Taxonomy_Audit.ipynb
  # and cross-checked with UAV patent literature (Zheng et al., 2026; JOITMC, 2020; Choe, 2023)
  positive_keywords:
    - "\\buav\\b"
    - "\\buavs\\b"
    - "\\buas\\b"
    - "\\brpas\\b"
    - "\\bunmanned aerial\\b"
    - "\\buncrewed aerial\\b"
    - "\\bunmanned aircraft\\b"
    - "\\bunmanned air\\b"
    - "\\bunmanned flight\\b"
    - "\\bunmanned flying\\b"
    - "\\bremotely piloted\\b"
    - "\\bdrone\\b"
    - "\\bdrones\\b"
    - "\\bquadrotor\\b"
    - "\\bquadcopter\\b"
    - "\\bmultirotor\\b"
    - "\\bmulticopter\\b"
    - "\\bhexacopter\\b"
    - "\\boctocopter\\b"
    - "\\bevtol\\b"
    - "\\bvtol\\b"
    - "\\brotorcraft\\b"
    - "\\bflying robot\\b"
    - "\\bflying vehicle\\b"
    - "\\baerial vehicle\\b"
    - "\\baerial vehicles\\b"
    - "\\baerial platform\\b"
    - "\\bmicro air\\b"
    - "\\bloitering munition\\b"

  negative_keywords:
    - "\\bautonomous driving\\b"
    - "\\broad vehicle\\b"
    - "\\blawnmower\\b"
    - "\\bsubmersible\\b"
    - "\\bunderwater vehicle\\b"
    - "\\bunmanned underwater\\b"
    - "\\bunmanned surface\\b"
    - "\\bauv\\b"
    - "\\busv\\b"
    - "\\bugv\\b"

# ------------------------------------------------------------------ Step 1 Q4: Patents vs Secrecy
q4_secrecy:
  # Mutually exclusive UAV sub-segments (priority order: military > dual_use > civil)
  military_cpc_prefixes:
    - "B64U2101/15"   # UAVs for conventional or electronic warfare
    - "B64U2101/16"   # UAVs for controlling, capturing or immobilising other vehicles
    - "B64U2101/17"   # UAVs for detecting, disrupting or countering communications
    - "B64U2101/18"   # UAVs for dropping bombs or firing ammunition
    - "B64U2101/19"   # UAVs for use as targets or decoys
    - "F41"           # Weapons (co-classification with UAV family)
    - "F42B10/"       # Aerodynamic projectiles / guided munitions
    - "F42B12/"       # Projectiles / missiles characterised by warhead
    - "F42B15/"       # Self-propelled projectiles or missiles

  dual_use_cpc_prefixes:
    - "B64U2101/31"   # UAVs for surveillance, inspection or monitoring (ISR / dual-use)

  benchmarks:
    manned_aircraft:
      label: "Manned aircraft (excl. UAVs)"
      cpc_prefixes: ["B64C", "B64D"]
    autonomous_vehicles:
      label: "Autonomous road vehicles"
      cpc_prefixes: ["B60W60/"]

# ------------------------------------------------------------------ Official CPC Definitions
# Verified against EPO / USPTO / WIPO CPC schemes
cpc_definitions:
  subclasses:
    B64U: "Unmanned aerial vehicles [UAVs]; equipment therefor"
    B64C: "Aeroplanes; helicopters (incl. legacy RPV code B64C 39/024)"
    B64D: "Equipment for fitting in or to aircraft; flying suits; parachutes; power plants"
    B64F: "Ground or aircraft-carrier-deck installations specially adapted for aircraft"
    G05D: "Systems for controlling or regulating non-electric variables (autonomy, flight control)"
    G08G: "Traffic control systems (UTM, air traffic management, geofencing)"
    G01C: "Measuring distances, levels or bearings; surveying; navigation; gyroscopic instruments"
    G01S: "Radio direction-finding; radar; lidar; sonar; satellite navigation (GNSS)"
    H04N: "Pictorial communication (aerial cameras, gimbals, video transmission)"
    H04W: "Wireless communication networks (UAV datalinks, cellular/5G command & control)"
    H04B: "Transmission (RF datalinks, anti-jamming, telemetry)"
    G06V: "Image or video recognition or understanding (computer vision, target tracking)"
    G06T: "Image data processing or generation (photogrammetry, SLAM, 3D mapping)"
    G06F: "Electric digital data processing (on-board computing, mission planning)"
    G06Q: "Data processing systems for administrative, commercial or logistics purposes (delivery)"
    H02J: "Circuit arrangements or systems for supplying or distributing electric power (charging/docking)"
    H01M: "Processes or means for direct conversion of chemical into electrical energy (batteries, fuel cells)"
    A01M: "Catching, trapping or scaring of animals; apparatus for destruction of noxious plants (agricultural spraying)"
    A01C: "Planting; sowing; fertilising (precision agriculture UAVs)"
    F41H: "Armour; armoured turrets; means of attack or defence (counter-UAS, military)"
    F42B: "Explosive charges; fireworks; ammunition; missiles"
    B60L: "Propulsion of electrically-propelled vehicles; power supply"
    B60W: "Conjoint control of vehicle sub-units (benchmark: B60W 60 automated driving)"

  b64u_main_groups:
    "B64U10/": "Type of UAV (rotorcrafts, multirotors, VTOL, fixed-wing, tethered, MAVs)"
    "B64U20/": "Constructional aspects of UAVs (airframes, foldable structures, payload bays)"
    "B64U30/": "Means for producing lift; empennages; wings, rotors & ducted fans"
    "B64U40/": "On-board mechanical arrangements for adjusting control surfaces, rotors or base configuration"
    "B64U50/": "Propulsion; power supply (motors, batteries, fuel cells, solar, in-flight charging)"
    "B64U60/": "Undercarriages (landing gear, skids, shock absorbers)"
    "B64U70/": "Launching, take-off, or landing arrangements (catapults, nets, docking stations)"
    "B64U80/": "Transport or storage specially adapted for UAVs (cases, mobile hangars)"
    "B64U2101/": "Indexing scheme: UAVs characterised by intended use (military, surveillance, delivery, agri)"
    "B64U2201/": "Indexing scheme: UAV control, navigation and communication aspects"

